<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes - FinanceLab Pro</title>

    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="dashboard">
      <!-- NAVBAR PRINCIPAL -->
      <header class="navbar">
        <div class="nav-logo">
          <img src="../img/logotipo-adv.webp" alt="Logo" />
        </div>

        <button class="menu-btn">
          <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-menu">
          <a class="nav-link" href="../index.html">Inicio</a>
          <a class="nav-link" href="teoria.html">Teoría</a>
          <a class="nav-link" href="calculadoras.html">Calculadoras</a>
          <a class="nav-link active" href="clientes.html">Simulador</a>
          <a class="nav-link" href="quiz.html">Quiz</a>
        </nav>

        <div class="nav-icons">
          <a href="https://github.com/GaloRamiro"
            ><i class="fa-brands fa-github"></i
          ></a>
          <a href="https://github.com/EvelynBorja20"
            ><i class="fa-brands fa-github"></i
          ></a>
        </div>
      </header>

      <!-- SUBMENÚ DEL SIMULADOR -->

      <section class="subnav">
        <a href="clientes.html" class="subnav-item active"> Clientes </a>

        <a href="creditos.html" class="subnav-item"> Créditos </a>

        <a href="pagos.html" class="subnav-item"> Pagos </a>
      </section>

      <!-- MAIN -->
      <main class="main">
        <section id="customer-register" class="panel customer-panel">
          <h3>Registro de Clientes</h3>

          <p class="panel-description">
            Ingresa los datos personales del solicitante para habilitar la
            simulación del crédito.
          </p>

          <div class="calc-form customer-grid">
            <input
              type="text"
              id="client-id"
              placeholder="Ingrese el número de cédula"
            />

            <input
              type="text"
              id="client-name"
              placeholder="Ingrese el nombre completo"
            />
            <input type="number" id="client-income" placeholder="Ingresos" />

            <input type="number" id="client-expenses" placeholder="Egresos" />

            <div class="customer-actions">
              <button id="save-client">Guardar cliente</button>

              <button type="button" id="clear-client">Limpiar</button>
            </div>
          </div>

          <!-- TABLA DE CLIENTES -->

          <table class="clients-table">
            <thead>
              <tr>
                <th>Cédula</th>
                <th>Nombre</th>
                <th>Ingresos</th>
                <th>Egresos</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody id="clients-body"></tbody>
          </table>

          <!-- RESULTADO -->

          <div
            class="result-box"
            id="client-status-box"
            style="display: none; margin-top: 20px"
          >
            <p style="color: #28a745; font-weight: bold">
              Cliente activo en el sistema:
            </p>

            <span id="active-client-text">--</span>
          </div>
        </section>

        <footer class="footer">
          <p>FinanceLab Pro © 2026</p>
        </footer>
      </main>
    </div>

    <!-- SCRIPTS -->

    <script src="../js/navegacion.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/clientes.js"></script>
  </body>
</html>
