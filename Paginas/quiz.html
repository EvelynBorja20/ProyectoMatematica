
<!DOCTYPE html>

          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<body>

<div class="dashboard">

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="nav-logo">
            <i class="fa-solid fa-chart-line"></i>
            <span>FinanceLab-Matemática 1</span>
        </div>

        <button class="menu-btn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-menu">
            <a class="nav-link" href="../index.html">
                <i class="fa-solid fa-house"></i>
                Inicio
            </a>

            <a class="nav-link" href="teoria.html">
                <i class="fa-solid fa-book"></i>
                Teoría
            </a>

            <a class="nav-link" href="calculadoras.html">
                <i class="fa-solid fa-calculator"></i>
                Calculadoras
            </a>

            <a class="nav-link" href="simulador.html">
                <i class="fa-solid fa-chart-pie"></i>
                Simulador
            </a>

            <a class="nav-link" href="clientes.html">
                <i class="fa-solid fa-user-plus"></i>
                Clientes
            </a>

            <a class="nav-link" href="creditos.html">
                <i class="fa-solid fa-money-bill"></i>
                Créditos
            </a>

            <a class="nav-link" href="pagos.html">
                <i class="fa-solid fa-cash-register"></i>
                Pagos
            </a>

            <a class="nav-link active" href="quiz.html">
                <i class="fa-solid fa-clipboard-question"></i>
                Quiz
            </a>
        </nav>

    </header>

    <!-- MAIN -->
    <main class="main">

        <section id="quiz" class="panel quiz-panel">

            <h3>Quiz Financiero</h3>

            <p class="panel-description">
                Pon a prueba tus conocimientos de matemática financiera y mejora tu score.
            </p>

            <!-- SCORE -->

            <div class="quiz-score-box">
                <h4>Score</h4>

                <p>
                    <span id="quiz-puntaje">0</span>
                    puntos
                </p>
            </div>

            <!-- PREGUNTA -->

            <div class="quiz-container">

                <h4 id="quiz-question">
                    Cargando pregunta...
                </h4>

                <div class="quiz-options">

                    <button class="quiz-option"></button>

                    <button class="quiz-option"></button>

                    <button class="quiz-option"></button>

                    <button class="quiz-option"></button>

                </div>

                <!-- FEEDBACK -->

                <div class="result-box quiz-feedback">

                    <h4>Feedback</h4>

                    <p id="quiz-feedback">
                        Selecciona una respuesta.
                    </p>

                </div>

                <button id="next-question">
                    Siguiente Pregunta
                </button>

            </div>

        </section>

        <footer class="footer">
            <p>FinanceLab Pro © 2026</p>
        </footer>

    </main>

</div>

<!-- SCRIPTS -->

<script src="../js/navegacion.js"></script>
