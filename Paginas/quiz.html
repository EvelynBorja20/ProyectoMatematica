<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Financiero - FinanceLab Pro</title>

    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="dashboard">
      <!-- NAVBAR -->
  <header class="navbar">
        <div class="nav-logo">
          <img src="../img/logotipo-adv.webp" alt="Logo" />
        </div>

        <button class="menu-btn">
          <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-menu">
          <a class="nav-link" href="../index.html">Inicio</a>
          <a class="nav-link" href="teoria.html">Teoría</a>
          <a class="nav-link" href="calculadoras.html">Calculadoras</a>
          <a class="nav-link" href="clientes.html">Simulador</a>
          <a class="nav-link active" href="quiz.html">Quiz</a>
        </nav>

        <div class="nav-icons">
          <a href="https://github.com/GaloRamiro"
            ><i class="fa-brands fa-github"></i
          ></a>
          <a href="https://github.com/EvelynBorja20"
            ><i class="fa-brands fa-github"></i
          ></a>
        </div>
      </header>

      <!-- MAIN -->
      <main class="main">
        <section id="quiz" class="panel quiz-panel">
          <h3>Quiz Financiero</h3>

          <p class="panel-description">
            Pon a prueba tus conocimientos de matemática financiera y mejora tu
            score.
          </p>

          <!-- SCORE -->

          <div class="quiz-score-box">
            <div class="score-icon"></div>

            <div class="score-info">
              <h4>Puntaje Actual</h4>

              <h2>
                <span id="quiz-puntaje">0</span>
                pts
              </h2>
            </div>
          </div>

          <!-- PREGUNTA -->

          <div class="quiz-container">
            <h4 id="quiz-question">Cargando pregunta...</h4>

            <div class="quiz-options">
              <button class="quiz-option"></button>

              <button class="quiz-option"></button>

              <button class="quiz-option"></button>

              <button class="quiz-option"></button>
            </div>

            <!-- FEEDBACK -->

            <div class="result-box quiz-feedback">
              <h4>Feedback</h4>

              <p id="quiz-feedback">Selecciona una respuesta.</p>
            </div>

            <button id="next-question">Siguiente Pregunta</button>
          </div>
        </section>

        <footer class="footer">
          <p>FinanceLab Pro © 2026</p>
        </footer>
      </main>
    </div>

    <!-- SCRIPTS -->

    <script src="../js/navegacion.js"></script>
    <script src="../js/utils.js"></script>

    <script src="../js/pregunatasJuego.js"></script>
    <script src="../js/juego.js"></script>
  </body>
</html>
